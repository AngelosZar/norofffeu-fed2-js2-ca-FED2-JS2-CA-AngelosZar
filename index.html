<!doctype html>
<html lang="en" class="bg-neutral-50 sm:scroll-smooth dark:bg-gray-900">
  <!-- or dark:bg-[#0A0A0F] -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="mx-auto grid max-w-screen-2xl text-black dark:text-white">
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full rounded-b-lg bg-white px-2 shadow-sm">
      <section class="mx-auto max-w-screen-2xl px-4 md:px-6 lg:px-8 xl:px-8">
        <div class="flex h-20 items-center justify-between">
          <a href="/" class="flex-shrink-0">
            <div class="w-28 md:w-36">
              <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-auto w-full" />
            </div>
          </a>
          <!-- desktop nav  -->
          <nav
            class="aria-label='Main nav' hidden md:flex md:items-center md:space-x-8 [&*:hover]:font-bold [&>*:hover]:text-blue-600 [&>*]:font-semibold [&>*]:transition-colors [&>a]:text-black lg:[&>a]:text-xl"
          >
            <a href="/">Home</a>
            <a href="/profile/">My Profile</a>
            <a href="/auth/login/">Login</a>
            <a href="/auth/register/">Register</a>
            <a href="#" id="desktop-logout-btn">Log out</a>
          </nav>
          <!-- hamburger -->
          <button
            id="hamburger-btn"
            class="inline-flex items-center justify-center p-2 focus:outline-none focus:ring-2 md:hidden"
            aria-expanded="false"
          >
            <span class="sr-only">Open main menu</span>
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="black">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <!-- Mobile nav -->
          <div id="mobile-menu" class="aria-label='Mobile nav' hidden md:hidden">
            <div class="fixed inset-0 z-50 bg-black bg-opacity-75" aria-hidden="true"></div>
            <div
              class="fixed inset-y-0 right-0 z-50 w-full origin-top animate-open-menu bg-white dark:bg-gray-900"
            >
              <div class="flex justify-end p-4">
                <!-- btn -->
                <button
                  id="mobile-close-btn"
                  class="text-black hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
                >
                  <span class="sr-only">Close menu</span>
                  <svg
                    class="h-12 w-12 dark:stroke-white"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="black"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
              <!-- nav -->
              <nav
                class="flex flex-col items-center justify-center space-y-6 px-4 py-6 text-black sm:items-end sm:pr-14 dark:text-white [&>*:hover]:text-blue-600 [&>*]:font-semibold [&>*]:transition-colors xs:[&>*]:text-3xl sm:[&>*]:text-5xl"
              >
                <a href="/">Home</a>
                <a href="/profile/">My Profile</a>
                <a href="/auth/login/">Login</a>
                <a href="/auth/register/">Register</a>
                <a href="#" id="mobile-logout-btn">Log out</a>
              </nav>
            </div>
          </div>
        </div>
      </section>
    </header>
    <!-- Main -->
    <main class="grid place-items-center px-2 py-4" id="main">
      <!-- <h2 class="dark:text-white">Create a new post</h2> -->
      <!-- <section class="place-self-start rounded-md bg-slate-200 px-7 py-4"> -->
      <section
        class="m-12 w-[90%] place-items-center rounded-md bg-slate-200 px-7 py-6 lg:w-[60%] dark:bg-gray-700 dark:text-white"
      >
        <div class="flex w-full flex-col sm:flex-row sm:justify-around">
          <label
            for="createPostInput"
            class="mb-4 flex items-center justify-center font-medium sm:mb-0 md:mb-0"
            >Whats on your mind ?</label
          >
          <div class="flex justify-center pl-4">
            <input
              type="text"
              id="createPostInput"
              class="rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 sm:w-72 md:w-96 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
              placeholder="Create a new post"
            />
            <svg
              version="1.1"
              id="Layer_1_1_"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              x="0px"
              y="0px"
              viewBox="0 0 16 16"
              style="enable-background: new 0 0 16 16"
              xml:space="preserve"
              class="w-6 pl-1"
            >
              <polygon points="1,1 1,15 15,8 "></polygon>
            </svg>
          </div>
        </div>
      </section>
      <!-- Main content /// feed  -->
      <section id="homepage-post-feed" class="grid">
        <h1 class="place-self-center p-12 text-4xl dark:text-white">Check out your Feed</h1>

        <div class="mx-auto" id="post-feed">
          <div
            class="card-for-posts mb-8 rounded-md border-2 border-slate-300 bg-slate-50 text-gray-600 dark:bg-gray-700 dark:text-white"
          >
            <div class="flex">
              <div class="">
                <img
                  src="https://images.unsplash.com/photo-1730407318819-6db610077721?q=80&w=1611&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                  class="m-4 h-16 w-16 rounded-full object-cover"
                  alt="User Avatar"
                />
              </div>
              <div class="m-5">
                <p id="userAvatarOnPost">username</p>
                <p id="timeOfPost">when posted</p>
              </div>
            </div>

            <h3 class="title-for-post px-4 py-2 text-xl font-bold">Post Title</h3>
            <p class="body-for-post px-4 pb-2 dark:text-gray-400">Post body</p>

            <div
              class="flex max-h-[36rem] max-w-[62rem] items-center justify-center overflow-hidden"
            >
              <img
                class="media-for-post h-auto w-full object-contain object-center"
                src="https://images.unsplash.com/photo-1730407318819-6db610077721?q=80&w=1611&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Image description"
              />
            </div>
            <p class="tags-for-post py-4 pl-4">tag1 / tag2 / tag3</p>
            <div
              class="flex justify-around pb-4 [&>a]:rounded-md [&>a]:px-4 [&>a]:py-2 [&>a]:transition-colors"
            >
              <a href="#" id="like-btn" class="hover:bg-slate-300">Like 👍 </a>
              <a href="#" id="comment-btn" class="hover:bg-slate-300">Comment 💬</a>
              <a href="#" id="share-btn" class="hover:bg-slate-300">Share ↪</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- footer -->
    <footer class="border-t-2 border-t-gray-500 pt-6 dark:text-white">
      <div class="mb-6 flex justify-around">
        <a href="#main">Go to top</a>
        <div>
          <p>&copy; 2021 Noroff</p>
          <p>All rights reserved</p>
        </div>
      </div>
    </footer>
  </body>
</html>
