<!doctype html>
<html lang="en" class="sm:scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <!-- <body class="flex min-h-screen max-w-screen-2xl flex-col" > -->
  <body class=" min-h-screen max-w-screen-2xl" >
  <!-- <body class=" grid min-h-screen max-w-screen-2xl "> -->
    <!-- Header start -->
    <header class="sticky top-0 z-50 w-full bg-white shadow-sm">
      <section class="mx-auto max-w-screen-2xl px-4 md:px-6 lg:px-8 xl:px-10 2xl:px-0">
        <div class="flex h-20 items-center justify-between">
          <!-- Logo placeholder // maybe change for dark mode >? -->
          <a href="/" class="flex-shrink-0">
            <div class="w-28 md:w-36">
              <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-auto w-full" />
            </div>
          </a>
          <!-- desktop nav  -->
          <nav class="aria-label='Main nav' hidden md:flex md:items-center md:space-x-8">
            <a
              href="/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Home</a
            >
            <a
              href="/profile/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >My Profile</a
            >
            <a
              href="/auth/login/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Login</a
            >
            <a
              href="/auth/register/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Register</a
            >
            <a
              href="#"
              id="desktop-logout-btn"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Log out</a
            >
          </nav>
          <!-- hamburger -->
          <button
            id="hamburger-btn"
            class="inline-flex items-center justify-center p-2 focus:outline-none focus:ring-2 md:hidden"
            aria-expanded="false"
          >
            <span class="sr-only">Open main menu</span>
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="black">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <!-- Mobile nav -->
          <div id="mobile-menu" class=" aria-label='Mobile nav' hidden md:hidden">
            <div class="fixed inset-0 z-50 bg-black bg-opacity-75" aria-hidden="true"></div>
            <div class="fixed inset-y-0 right-0 z-50 w-full bg-white">
              <div class="flex justify-end p-4">
                <!-- btn -->
                <button 
                  id="mobile-close-btn"
                  class="text-black hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
                >
                  <span class="sr-only">Close menu</span>
                  <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="black">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
              <!--  nav -->
              <nav class="flex flex-col items-center  sm:items-end sm:pr-14 py-6 px-4 space-y-6 justify-center">
                <a href="/" class="text-2xl font-semibold text-black hover:text-blue-600 hover:font-bold  transition-colors">Home</a>
                <a href="/profile/" class="text-2xl font-semibold text-black hover:text-blue-600 hover:font-bold  transition-colors">My Profile</a>
                <a href="/auth/login/" class="text-2xl font-semibold text-black hover:text-blue-600 hover:font-bold  transition-colors">Login</a>
                <a href="/auth/register/" class="text-2xl font-semibold text-black hover:text-blue-600 hover:font-bold  transition-colors">Register</a>
                <a href="#" id="mobile-logout-btn" class="text-2xl font-semibold text-black hover:text-blue-600 hover:font-bold  transition-colors">Log out</a>
              </nav>
            </div>
        </div>
      </section>
    </header>
    <!-- Header end -->
    <main class="mx-auto flex flex-col justify-center" id="main">
      <section id="homepage-overlay">
        <h1>Latest posts</h1>
        <div id="post-feed"></div>
      </section>
    </main>
    <!--  -->
    <footer class="m-6 flex justify-around">
      <a href="#main">Go to top</a>
      <div>
        <p>&copy; 2021 Noroff</p>
        <p>All rights reserved</p>
      </div>

      <!-- add smooth scrolling -->
    </footer>
  </body>
</html>
