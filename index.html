<!doctype html>
<html lang="en" class="sm:scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <!-- <body class="flex min-h-screen max-w-screen-2xl flex-col" > -->
  <body class="mx-auto grid h-screen min-h-screen max-w-screen-2xl">
    <!-- <body class=" grid min-h-screen max-w-screen-2xl "> -->
    <!-- Header start -->
    <header class="sticky top-0 z-50 w-full bg-white px-2 shadow-sm">
      <section class="mx-auto max-w-screen-2xl px-4 md:px-6 lg:px-8 xl:px-10 2xl:px-0">
        <div class="flex h-20 items-center justify-between">
          <!-- Logo placeholder // maybe change for dark mode >? -->
          <a href="/" class="flex-shrink-0">
            <div class="w-28 md:w-36">
              <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-auto w-full" />
            </div>
          </a>
          <!-- desktop nav  -->
          <nav class="aria-label='Main nav' hidden md:flex md:items-center md:space-x-8">
            <a
              href="/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Home</a
            >
            <a
              href="/profile/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >My Profile</a
            >
            <a
              href="/auth/login/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Login</a
            >
            <a
              href="/auth/register/"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Register</a
            >
            <a
              href="#"
              id="desktop-logout-btn"
              class="text-base font-semibold text-black transition-colors hover:font-bold hover:text-blue-600 lg:text-lg"
              >Log out</a
            >
          </nav>
          <!-- hamburger -->
          <button
            id="hamburger-btn"
            class="inline-flex items-center justify-center p-2 focus:outline-none focus:ring-2 md:hidden"
            aria-expanded="false"
          >
            <span class="sr-only">Open main menu</span>
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="black">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <!-- Mobile nav -->
          <div id="mobile-menu" class="aria-label='Mobile nav' hidden md:hidden">
            <div class="fixed inset-0 z-50 bg-black bg-opacity-75" aria-hidden="true"></div>
            <div class="animate-open-menu fixed inset-y-0 right-0 z-50 w-full origin-top bg-white">
              <div class="flex justify-end p-4">
                <!-- btn -->
                <button
                  id="mobile-close-btn"
                  class="text-black hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
                >
                  <span class="sr-only">Close menu</span>
                  <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="black">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
              <!--  nav -->
              <nav
                class="flex flex-col items-center justify-center space-y-6 px-4 py-6 sm:items-end sm:pr-14"
              >
                <a
                  href="/"
                  class="text-2xl font-semibold text-black transition-colors hover:font-bold hover:text-blue-600"
                  >Home</a
                >
                <a
                  href="/profile/"
                  class="text-2xl font-semibold text-black transition-colors hover:font-bold hover:text-blue-600"
                  >My Profile</a
                >
                <a
                  href="/auth/login/"
                  class="text-2xl font-semibold text-black transition-colors hover:font-bold hover:text-blue-600"
                  >Login</a
                >
                <a
                  href="/auth/register/"
                  class="text-2xl font-semibold text-black transition-colors hover:font-bold hover:text-blue-600"
                  >Register</a
                >
                <a
                  href="#"
                  id="mobile-logout-btn"
                  class="text-2xl font-semibold text-black transition-colors hover:font-bold hover:text-blue-600"
                  >Log out</a
                >
              </nav>
            </div>
          </div>
        </div>
      </section>
    </header>
    <!-- Main -->
    <main class="grid place-items-center px-2 py-4" id="main">
      <h2>Create a new post</h2>
      <section class="place-self-start rounded-md bg-slate-200 px-7 py-4">
        <label for="">Whats on your mind ?</label>
        <input type="text" />
      </section>
      <h2>End of section</h2>
      <section id="homepage-overlay">
        <h1>Check out your Latest posts</h1>

        <div class="container mx-auto max-w-[95%] md:max-w-[75%]" id="post-feed">
          <!-- Individual Post Card -->
          <div class="card-for-posts rounded-md border-2 border-slate-300 bg-slate-50">
            <h3 class="title-for-post px-4 py-2 text-xl font-bold">Post Title</h3>
            <p class="body-for-post px-4 pb-2">Post body</p>

            <div class="">
              <img
                class="media-for-post"
                src="https://images.unsplash.com/photo-1730388623585-ce2dec1e2355?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="Image description"
              />
            </div>
            <p class="tags-for-post py-4 pl-4">tag1 / tag2 / tag3</p>
            <div
              class="flex justify-around pb-4 [&>a]:rounded-md [&>a]:px-4 [&>a]:py-2 [&>a]:transition-colors"
            >
              <a href="#" id="like-btn" class="hover:bg-slate-300">Like 👍 </a>
              <a href="#" id="comment-btn" class="hover:bg-slate-300">Comment 💬</a>
              <a href="#" id="share-btn" class="hover:bg-slate-300">Share ↪</a>
            </div>
          </div>
        </div>

        <!-- test -->
      </section>
    </main>
    <!--  -->
    <footer class="my-6 flex justify-around">
      <a href="#main">Go to top</a>
      <div>
        <p>&copy; 2021 Noroff</p>
        <p>All rights reserved</p>
      </div>
    </footer>
  </body>
</html>
