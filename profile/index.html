<!doctype html>
<html lang="en" class="bg-neutral-50 dark:bg-gray-900">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="mx-auto grid max-w-screen-2xl text-black dark:text-white">
    <header class="sticky top-0 z-50 w-full rounded-b-lg bg-white px-2 shadow-sm">
      <section class="mx-auto max-w-screen-2xl px-4 md:px-6 lg:px-8 xl:px-8">
        <div class="flex h-20 items-center justify-between">
          <a href="/" class="flex-shrink-0">
            <div class="w-28 md:w-36">
              <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-auto w-full" />
            </div>
          </a>
          <!-- desktop nav  -->
          <nav
            class="aria-label='Main nav' hidden md:flex md:items-center md:space-x-8 [&*:hover]:font-bold [&>*:hover]:text-blue-600 [&>*]:font-semibold [&>*]:transition-colors [&>a]:text-black lg:[&>a]:text-xl"
          >
            <a href="/">Home</a>
            <a href="/profile/">My Profile</a>
            <a href="/auth/login/">Login</a>
            <a href="/auth/register/">Register</a>
            <a href="#" id="desktop-logout-btn">Log out</a>
          </nav>
          <!-- hamburger -->
          <button
            id="hamburger-btn"
            class="inline-flex items-center justify-center p-2 focus:outline-none focus:ring-2 md:hidden"
            aria-expanded="false"
          >
            <span class="sr-only">Open main menu</span>
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="black">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <!-- Mobile nav -->
          <div id="mobile-menu" class="aria-label='Mobile nav' hidden md:hidden">
            <div class="fixed inset-0 z-50 bg-black bg-opacity-75" aria-hidden="true"></div>
            <div
              class="fixed inset-y-0 right-0 z-50 w-full origin-top animate-open-menu bg-white dark:bg-gray-900"
            >
              <div class="flex justify-end p-4">
                <!-- btn -->
                <button
                  id="mobile-close-btn"
                  class="text-black hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
                >
                  <span class="sr-only">Close menu</span>
                  <svg
                    class="h-12 w-12 dark:stroke-white"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="black"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
              <!-- nav -->
              <nav
                class="flex flex-col items-center justify-center space-y-6 px-4 py-6 text-black sm:items-end sm:pr-14 dark:text-white [&>*:hover]:text-blue-600 [&>*]:font-semibold [&>*]:transition-colors xs:[&>*]:text-3xl sm:[&>*]:text-5xl"
              >
                <a href="/">Home</a>
                <a href="/profile/">My Profile</a>
                <a href="/auth/login/">Login</a>
                <a href="/auth/register/">Register</a>
                <a href="#" id="mobile-logout-btn">Log out</a>
              </nav>
            </div>
          </div>
        </div>
      </section>
    </header>

    <main class="">
      <section class="profile-banner-container flex flex-col border-x-2 border-b-2 border-gray-400">
        <div
          class="profile-banner lg:mb-18 relative mb-8 max-w-screen-2xl xs:mb-12 md:mb-14 lg:mb-20"
        >
          <img
            alt="Profile Banner"
            class="banner-img h-[15vh] w-full object-cover md:h-[20vh] lg:h-[25vh]"
          />
          <img
            alt="User Avatar"
            class="avatar-img top profile-info xs:left-6md:-bottom-14 absolute -bottom-5 left-4 h-20 w-20 rounded-full xs:-bottom-12 xs:h-28 xs:w-28 md:left-8 md:h-36 md:w-36 lg:-bottom-16 lg:left-10 lg:h-44 lg:w-44 xl:-bottom-20 xl:h-52 xl:w-52"
          />
        </div>
        <div class="user-details mx-6 xs:my-4 xs:text-xl md:mx-8 md:text-2xl xl:mx-12">
          <h1 class="user-name"></h1>
          <p>
            <strong>Bio:</strong>
          </p>
          <p><strong>Location:</strong> Oslo , Norway</p>
          <p><strong>Followers:</strong> 1</p>
        </div>
      </section>
      <section>
        <!-- change to forms -->
        <div class="action-bar">
          <a href="../post/create/" class="primary__button">Create a new post</a>
          <a href="../post/edit/" class="primary__button">edit a post</a>
          <a href="../post/" class="primary__button">see posts</a>
        </div>
        <div class="follow-container">
          <!-- method put or post and action /follow and unfollow -->
          <form id="followForm" class="mx-auto mb-5 flex max-w-sm justify-evenly">
            <label for="followUser" class="flex w-full items-center justify-center font-medium"
              >Follow a user</label
            >
            <input
              type="text"
              name="follow"
              id="followUser"
              placeholder="Username"
              class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
            />
            <button type="submit" class="ml-6">Follow</button>
          </form>
          <br />
          <div>
            <form id="unFollowForm">
              <label for="unFollowUser">Unfollow a user</label>
              <input type="text" name="unFollow" id="unFollowUser" placeholder="Username " />
              <button type="submit">Unfollow</button>
            </form>
          </div>
        </div>
      </section>
      <section>
        <h1>Your latest posts</h1>
        <div id="profile-post-feed"></div>
      </section>
    </main>
    <footer class="border-t-2 border-t-gray-500 pt-6 dark:text-white">
      <div class="mb-6 flex justify-around">
        <a href="#main">Go to top</a>
        <div>
          <p>&copy; 2021 Noroff</p>
          <p>All rights reserved</p>
        </div>
      </div>
    </footer>
  </body>
</html>
