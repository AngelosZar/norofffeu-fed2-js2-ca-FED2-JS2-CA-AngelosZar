<!doctype html>
<html lang="en" class="bg-neutral-50 sm:scroll-smooth dark:bg-gray-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body
    class="mx-auto grid min-h-screen max-w-screen-2xl place-items-center text-black dark:text-white"
  >
    <header class="sticky top-0 z-50 w-full rounded-b-lg bg-white px-2 shadow-sm">
      <section class="mx-auto max-w-screen-2xl px-4 md:px-6 lg:px-8 xl:px-8">
        <div class="flex h-20 items-center justify-between">
          <a href="/" class="flex-shrink-0">
            <div class="w-28 md:w-36">
              <img src="/images/noroff-logo.png" alt="Noroff Logo" class="h-auto w-full" />
            </div>
          </a>
          <!-- desktop nav  -->
          <nav
            class="aria-label='Main nav' hidden md:flex md:items-center md:space-x-8 [&*:hover]:font-bold [&>*:hover]:text-blue-600 [&>*]:font-semibold [&>*]:transition-colors [&>a]:text-black lg:[&>a]:text-xl"
          >
            <a href="/">Home</a>
            <a href="/profile/">My Profile</a>
            <a href="/auth/login/">Login</a>
            <a href="/auth/register/">Register</a>
            <a href="" id="desktop-logout-btn" class="logout-btn">Log out</a>
          </nav>
          <!-- hamburger -->
          <button
            id="hamburger-btn"
            class="inline-flex items-center justify-center p-2 focus:outline-none focus:ring-2 md:hidden"
            aria-expanded="false"
          >
            <span class="sr-only">Open main menu</span>
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="black">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>
          <!-- Mobile nav -->
          <div id="mobile-menu" class="aria-label='Mobile nav' hidden md:hidden">
            <div class="fixed inset-0 z-50 bg-black bg-opacity-75" aria-hidden="true"></div>
            <div
              class="fixed inset-y-0 right-0 z-50 w-full origin-top animate-open-menu bg-white dark:bg-gray-900"
            >
              <div class="flex justify-end p-4">
                <!-- btn -->
                <button
                  id="mobile-close-btn"
                  class="text-black hover:text-blue-600 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-green-500"
                >
                  <span class="sr-only">Close menu</span>
                  <svg
                    class="h-12 w-12 dark:stroke-white"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="black"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </button>
              </div>
              <!-- nav -->
              <nav
                class="flex flex-col items-center justify-center space-y-6 px-4 py-6 text-black sm:items-end sm:pr-14 dark:text-white [&>*:hover]:text-blue-600 [&>*]:font-semibold [&>*]:transition-colors xs:[&>*]:text-3xl sm:[&>*]:text-5xl"
              >
                <a href="/">Home</a>
                <a href="/profile/">My Profile</a>
                <a href="/auth/login/">Login</a>
                <a href="/auth/register/">Register</a>
                <a href="" id="mobile-logout-btn" class="logout-btn">Log out</a>
              </nav>
            </div>
          </div>
        </div>
      </section>
    </header>
    <!--  -->
    <main class="grid min-h-screen w-full grid-cols-1 place-items-center gap-4">
      <section class="grid min-h-screen grid-cols-1 place-items-center md:grid-cols-2">
        <div>
          <div id="register-form">
            <h1 class="mb-8 text-3xl font-bold">Register</h1>
            <form name="register">
              <div class="mb-5">
                <label for="name">Name</label>
                <input
                  id="name"
                  type="text"
                  name="name"
                  required
                  placeholder="Username"
                  maxlength="20"
                  pattern="^[\w]+$"
                  title="Please enter a username using only letters and numbers"
                  class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                />
              </div>

              <div class="mb-5">
                <label for="email">Email</label>
                <input
                  id="email"
                  type="email"
                  name="email"
                  placeholder="Email@stud.noroff.no"
                  required
                  pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
                  title="Please enter a valid noroff.no or stud.noroff.no address"
                  class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                />
              </div>

              <div class="mb-5">
                <label for="password">Password</label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  required
                  minlength="8"
                  class="mb-5 block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                />
                <!-- extra margin bottom on password label -->
                <div>
                  <label for="bio">Bio (Optional)</label>
                  <input
                    type="text"
                    id="bio"
                    class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label for="profileImg">Profile image url(Optional)</label>
                  <input
                    type="url"
                    id="profileImg"
                    class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                  />
                </div>
                <div>
                  <label for="profileImgAlt">Profile image alternative url(Optional)</label>
                  <input
                    type="url"
                    id="profileImgAlt"
                    class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
                  />
                </div>
              </div>

              <button class="rounded-lg bg-blue-500 px-4 py-2 text-white hover:bg-blue-700">
                Register
              </button>
              <div class="mt-8">
                <p>Alrready have an acount ?<br />⬇️ Click here to login</p>
                <a
                  href="/auth/login/"
                  class="text my-2 text-2xl text-blue-500 underline hover:text-blue-700"
                  >Login</a
                >
              </div>
            </form>
          </div>
        </div>
        <div class="hidden h-full w-full md:block">
          <img
            src="https://images.unsplash.com/photo-1522709553816-36115b3cc2ef?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="typewriter"
            class="h-full w-full object-cover"
          />
        </div>
      </section>
    </main>
    <!--  -->

    <!--  -->

    <!--  -->
    <footer class="w-full border-t-2 border-t-gray-500 pt-6">
      <div class="mb-6 flex justify-around">
        <a href="#main">Go to top</a>
        <div>
          <p>&copy; 2021 Noroff</p>
          <p>All rights reserved</p>
        </div>
      </div>
    </footer>
  </body>
</html>
